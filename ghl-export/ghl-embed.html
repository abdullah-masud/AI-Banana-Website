@keyframes robotTaskProgress { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* Problem */
.problem-section { background: var(--white); }
.problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; border: 1px solid var(--line); border-right: 0; border-bottom: 0; border-radius: 18px; }
.problem-item { min-height: 208px; padding: 32px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 20px; transition: background .3s ease, box-shadow .3s var(--ease-premium); }

.icon-box { flex: 0 0 auto; width: 44px; height: 44px; display: grid; place-items: center; background: #f7f4ec; border: 1px solid #eee4ce; border-radius: 11px; color: var(--dark-gold); transition: transform .3s var(--ease-premium), background .3s ease; }
.problem-item:hover .icon-box { transform: translateY(-2px); background: #f6ecd5; }
.icon-box svg { width: 20px; }

/* Solution */

.solution-section::before { content: ''; position: absolute; inset: 0; opacity: .28; background-image: linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px); background-size: 56px 56px; mask-image: linear-gradient(to bottom,black,transparent 90%); }
.solution-section__orb { position: absolute; width: 700px; height: 700px; top: -390px; right: -230px; border-radius: 50%; background: radial-gradient(circle,rgba(81,158,255,.16),transparent 66%); }
.solution-section .container { position: relative; z-index: 2; }
.employee-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
.employee-card { position: relative; min-height: 264px; padding: 30px; overflow: hidden; border: 1px solid rgba(255,255,255,.09); border-radius: 17px; background: rgba(255,255,255,.045); transition: transform .38s var(--ease-premium), border-color .3s ease, background .3s ease, box-shadow .38s var(--ease-premium); }
.employee-card:hover { transform: translateY(-6px); border-color: rgba(222,160,27,.4); background: rgba(255,255,255,.07); box-shadow: 0 22px 44px rgba(0,0,0,.18); }
.employee-card__icon { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid rgba(135,205,255,.25); border-radius: 12px; color: #a6d9ff; background: rgba(56,138,210,.09); box-shadow: 0 0 30px rgba(73,160,232,.08); }

.employee-card:hover .employee-card__line { width: 52px; }

/* Benefits */
.benefits-section { background: #f5f7fa; }
.benefits-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: #dfe4eb; border: 1px solid #dfe4eb; border-radius: 18px; overflow: hidden; box-shadow: 0 24px 60px rgba(15,34,95,.07); }
.benefit-card { min-height: 212px; padding: 32px; background: var(--white); display: flex; flex-direction: column; transition: transform .35s var(--ease-premium), box-shadow .35s var(--ease-premium), background .3s ease; }

.benefit-card span { margin-top: 6px; color: var(--muted); font-size: .82rem; line-height: 1.5; }

/* Challenge */
.challenge-section { overflow: hidden; background: var(--white); }
.challenge-grid { display: grid; grid-template-columns: .9fr 1.1fr; align-items: center; gap: 100px; }
.challenge-phone-wrap { position: relative; display: flex; justify-content: center; }

/* Process */

.process-grid { position: relative; display: grid; grid-template-columns: repeat(4,1fr); gap: 30px; }

/* Industries */

.industries-stat { max-width: 470px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 18px; padding-top: 27px; border-top: 1px solid rgba(255,255,255,.24); }

/* Why */
.why-section { background: #f5f7fa; }
.why-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 100px; }

/* Founder story */
.founder-story { overflow: hidden; background: var(--white); }

</div></div><div class="challenge-phone-wrap__ring"></div></div><div class="reveal  challenge-copy" style="transition-delay:0ms"><p class="eyebrow challenge-copy__eyebrow"><span></span>Live AI Receptionist Challenge</p><h2>Think Your Customers<br/>Are Difficult?</h2><p class="challenge-copy__lead">Call our AI Receptionist and put her to the test. Ask complicated questions. Interrupt her. Change your mind. Listen to how professionally she handles the conversation.</p><div class="challenge-prompts"><span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg>Ask a complicated question.</span><span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg>Interrupt while she is speaking.</span><span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg>Change your appointment request.</span><span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg>Say you are frustrated.</span><span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg>Give incomplete information.</span><span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg>Request to speak with a human.</span></div><span class="button button--primary button--disabled " aria-disabled="true"><span>Call the AI Receptionist</span><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span><p class="challenge-copy__note">No sales representative will answer. You&#x27;ll speak directly with the live AI demonstration.</p></div></div></section><section class="section process-section" id="how-it-works"><div class="container"><div class="reveal  " style="transition-delay:0ms"><div class="section-heading section-heading--center section-heading--light"><p class="eyebrow"><span></span>How it works</p><h2>From Busywork to Built-In.</h2><p class="section-heading__body">A clear, collaborative process that turns repetitive work into a dependable AI workforce.</p></div></div><div class="process-grid"><div class="reveal  process-step" style="transition-delay:0ms"><div class="process-step__marker"><span>01</span></div><h3>Discovery</h3><p>We learn how your business works, where time disappears, and what your customers expect.</p><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right process-step__arrow process-step__arrow--desktop"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejo     host.style.setProperty('margin-left', '0', 'important');
    const leftOffset = host.getBoundingClientRect().left;
    host.style.setProperty('width', document.documentElement.clientWidth + 'px', 'important');
    host.style.setProperty('margin-left', -leftOffset + 'px', 'important');
  };
  sizeToViewport();
  window.addEventListener('resize', sizeToViewport, { passive: true });

  host.dataset.initialized = 'true';
  const root = host.shadowRoot || host.attachShadow({ mode: 'open' });
  root.appendChild(template.content.cloneNode(true));

  const page = root.querySelector('.ai-banana-page');
  const navbar = root.querySelector('.navbar');
  const menuButton = root.querySelector('.navbar__menu-button');
  const mobileMenu = root.getElementById('mobile-navigation');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const closeMenu = () => {
    if (!menuButton || !mobileMenu) return;
    menuButton.setAttribute('aria-expanded', 'false');
    menuButton.setAttribute('aria-label', 'Open navigation menu');
    mobileMenu.setAttribute('aria-hidden', 'true');
    mobileMenu.classList.remove('mobile-menu--open');
    menuButton.querySelector('.menu-icon-open')?.removeAttribute('hidden');
    menuButton.querySelector('.menu-icon-close')?.setAttribute('hidden', '');
    document.documentElement.style.overflow = '';
  };

  const toggleMenu = () => {
    if (!menuButton || !mobileMenu) return;
    const willOpen = menuButton.getAttribute('aria-expanded') !== 'true';
    menuButton.setAttribute('aria-expanded', String(willOpen));
    menuButton.setAttribute('aria-label', willOpen ? 'Close navigation menu' : 'Open navigation menu');
    mobileMenu.setAttribute('aria-hidden', String(!willOpen));
    mobileMenu.classList.toggle('mobile-menu--open', willOpen);
    menuButton.querySelector('.menu-icon-open')?.toggleAttribute('hidden', willOpen);
    menuButton.querySelector('.menu-icon-close')?.toggleAttribute('hidden', !willOpen);
    document.documentElement.style.overflow = willOpen ? 'hidden' : '';
  };

  menuButton?.addEventListener('click', toggleMenu);
  window.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeMenu(); });

  const updateNavbar = () => navbar?.classList.toggle('navbar--scrolled', window.scrollY > 24);
  updateNavbar();
  window.addEventListener('scroll', updateNavbar, { passive: true });

  root.querySelectorAll('a[href^="#"]').forEach((link) => {
    link.addEventListener('click', (event) => {
      const target = root.querySelector(link.getAttribute('href'));
      if (!target) return;
      event.preventDefault();
      closeMenu();
      const navbarOffset = navbar?.getBoundingClientRect().height || 0;
      const top = target.getBoundingClientRect().top + window.scrollY - navbarOffset;
      window.scrollTo({ top, behavior: reducedMotion ? 'auto' : 'smooth' });
    });
  });

  const revealItems = root.querySelectorAll('.reveal');
  if (reducedMotion || !('IntersectionObserver' in window)) {
    revealItems.forEach((item) => item.classList.add('reveal--visible'));
  } else {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('reveal--visible');
        observer.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    revealItems.forEach((item) => observer.observe(item));
  }

  const tasks = [...root.querySelectorAll('.hero__task-sequence > span')];
  const workforceStatus = root.querySelector('.hero__status-card--top');
  const workforceLabel = workforceStatus?.querySelector('strong');
  const showCompletedState = () => {
    tasks.forEach((task) => { task.classList.add('hero__task--active'); task.setAttribute('aria-hidden', 'false'); });
    workforceStatus?.classList.add('hero__status-card--online');
    if (workforceLabel) workforceLabel.textContent = 'AI Workforce Online';
  };

  if (reducedMotion) showCompletedState();
  else {
    [500, 1450, 2400, 2900, 3250, 3600].forEach((delay, index) => {
      window.setTimeout(() => {
        tasks[index]?.classList.add('hero__task--active');
        tasks[index]?.setAttribute('aria-hidden', 'false');
      }, delay);
    });
    window.setTimeout(showCompletedState, 4000);
  }

  let chatOpenRetry;
  const openLeadConnectorChat = () => {
    if (chatOpenRetry) window.clearTimeout(chatOpenRetry);
    let attempts = 0;

    const openIfReady = () => {
      const openWidget = window.leadConnector?.chatWidget?.openWidget;
      if (typeof openWidget !== 'function') return false;
      try { openWidget(); return true; }
      catch { return false; }
    };
    const stopWaiting = () => {
      window.removeEventListener('LC_chatWidgetLoaded', handleWidgetLoaded);
      if (chatOpenRetry) window.clearTimeout(chatOpenRetry);
      chatOpenRetry = undefined;
    };
    const tryToOpen = () => {
      attempts += 1;
      if (openIfReady() || attempts >= 20) { stopWaiting(); return; }
      chatOpenRetry = window.setTimeout(tryToOpen, 150);
    };
    function handleWidgetLoaded() { if (openIfReady()) stopWaiting(); }

    window.addEventListener('LC_chatWidgetLoaded', handleWidgetLoaded);
    tryToOpen();
  };

  root.querySelectorAll('.button--disabled').forEach((element) => {
    if (element.textContent?.trim() !== 'Book Through Our AI Receptionist') return;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `${element.className.replace('button--disabled', '').trim()} button--chat-trigger`;
    button.innerHTML = element.innerHTML;
    button.addEventListener('click', openLeadConnectorChat);
    element.replaceWith(button);
  });

  const aiReceptionistWidgetId = '6a871a3c07754ad08addc62b';
  const aiReceptionistScriptId = 'leadconnector-ai-receptionist-loader';
  let aiReceptionistOpen;
  let aiReceptionistLoadPromise;
  let generalChatApi;

  const findAiReceptionistWidget = () => [...document.querySelectorAll('chat-widget')]
    .find((widget) => widget.widgetId === aiReceptionistWidgetId);

  const hideAiReceptionistWhenClosed = (widget) => {
    const handleClosed = () => {
      if (widget.dataset.active === 'false') {
        widget.style.display = 'none';
        window.removeEventListener('lc-widget-closed', handleClosed);
      }
    };
    window.addEventListener('lc-widget-closed', handleClosed);
  };

  const showAndOpenAiReceptionist = () => {
    const widget = findAiReceptionistWidget();
    if (!widget || !aiReceptionistOpen) return;
    generalChatApi?.closeWidget?.();
    widget.style.display = '';
    aiReceptionistOpen();
    hideAiReceptionistWhenClosed(widget);
  };

  const loadAiReceptionistWidget = () => {
    if (aiReceptionistLoadPromise) return aiReceptionistLoadPromise;

    aiReceptionistLoadPromise = new Promise((resolve) => {
      generalChatApi = window.leadConnector?.chatWidget;
      const concealWidget = new MutationObserver(() => {
        const widget = findAiReceptionistWidget();
        if (widget) {
          widget.style.display = 'none';
          concealWidget.disconnect();
        }
      });
      concealWidget.observe(document.body, { childList: true, subtree: true });

      const timeoutId = window.setTimeout(() => {
        concealWidget.disconnect();
        window.removeEventListener('LC_chatWidgetLoaded', handleLoaded);
        resolve();
      }, 12000);

      function handleLoaded(event) {
        const eventRoot = event.detail?.getRootNode?.();
        const widget = eventRoot instanceof ShadowRoot ? eventRoot.host : findAiReceptionistWidget();
        if (widget?.widgetId !== aiReceptionistWidgetId) return;

        aiReceptionistOpen = window.leadConnector?.chatWidget?.openWidget;
        if (generalChatApi && window.leadConnector) window.leadConnector.chatWidget = generalChatApi;
        widget.style.display = 'none';
        window.clearTimeout(timeoutId);
        concealWidget.disconnect();
        window.removeEventListener('LC_chatWidgetLoaded', handleLoaded);
        resolve();
      }

      window.addEventListener('LC_chatWidgetLoaded', handleLoaded);
      if (!document.getElementById(aiReceptionistScriptId)) {
        const script = document.createElement('script');
        script.id = aiReceptionistScriptId;
        script.src = 'https://widgets.leadconnectorhq.com/loader.js';
        script.async = true;
        script.dataset.resourcesUrl = 'https://widgets.leadconnectorhq.com/chat-widget/loader.js';
        script.dataset.widgetId = aiReceptionistWidgetId;
        document.body.appendChild(script);
      }
    });

    return aiReceptionistLoadPromise;
  };

  const openAiReceptionistWidget = () => {
    if (aiReceptionistOpen) { showAndOpenAiReceptionist(); return; }
    void loadAiReceptionistWidget().then(showAndOpenAiReceptionist);
  };

  root.querySelectorAll('.button--disabled').forEach((element) => {
    if (element.textContent?.trim() !== 'Call the AI Receptionist') return;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = element.className.replace('button--disabled', '').trim();
    button.innerHTML = element.innerHTML;
    button.addEventListener('click', openAiReceptionistWidget);
    element.replaceWith(button);
  });

  const phoneCall = root.querySelector('.phone-mockup__call--disabled');
  if (phoneCall) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = phoneCall.className.replace('phone-mockup__call--disabled', '').trim();
    button.setAttribute('aria-label', 'Call the AI Receptionist');
    button.innerHTML = phoneCall.innerHTML;
    button.addEventListener('click', openAiReceptionistWidget);
    phoneCall.replaceWith(button);
  }

  const loadChat = () => window.setTimeout(() => {
    const widgetId = '6a7cd8798ce6e21783d93638';
    if (document.getElementById('leadconnector-chat-widget-loader') || document.querySelector('script[data-widget-id="' + widgetId + '"]')) return;
    const script = document.createElement('script');
    script.id = 'leadconnector-chat-widget-loader';
    script.src = 'https://widgets.leadconnectorhq.com/loader.js';
    script.async = true;
    script.dataset.resourcesUrl = 'https://widgets.leadconnectorhq.com/chat-widget/loader.js';
    script.dataset.widgetId = widgetId;
    document.body.appendChild(script);
  }, 0);

  if (document.readyState === 'complete') loadChat();
  else window.addEventListener('load', loadChat, { once: true });

  page?.querySelector('.skip-link')?.addEventListener('click', () => root.getElementById('main-content')?.focus({ preventScroll: true }));
})();
</script>
